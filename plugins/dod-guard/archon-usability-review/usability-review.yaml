name: usability-review
description: |
  Review a user-facing interface or workflow for usability, accessibility and
  AI trust cues from the evidence in the checkout. A read-only session follows
  the usability-review skill and writes structured findings. A script then
  holds them to the skill's rules: every journey question, accessibility check
  and trust cue is covered with a cited value or marked not observed, never
  passed on no evidence; a CLI, API or document gets no visual checks; and
  every citation names a file and line that exist. This workflow has no
  browser, so live states are never observed, and a GUI report says so. A
  failed check goes back to the session once. The report, in the skill's own
  shape, is the run's output and stays in the artifacts. Nothing is edited,
  committed or opened.

  Use when: planning, building or reviewing a feature whose user's task,
  interaction path or interface states need an evidence-backed critique.
  NOT for: whether the feature can be reached at all (wiring-audit), a formal
  accessibility conformance audit, or fixing what it finds.

  Run with: archon workflow run TychoHenzen/dod-guard:usability-review
            --branch review/<name> --input request="<the feature and its user>"
            [--input issue=<number>]

model: medium

inputs:
  request:
    required: true
    description: The interface or workflow to review, who uses it and for what.
  issue:
    default: ""
    description: Issue number holding the PBI and acceptance criteria. Needs a GitHub remote.

nodes:
  - id: brief
    bash: |
      set -euo pipefail
      printf '%s\n' "$INPUTS_REQUEST" > "$ARTIFACTS_DIR/request.md"
      if [ -n "$INPUTS_ISSUE" ]; then
        case "$INPUTS_ISSUE" in
          *[!0-9]*) echo "issue must be a number: '$INPUTS_ISSUE'" >&2; exit 1 ;;
        esac
        gh issue view "$INPUTS_ISSUE" --json number,title,body,comments > "$ARTIFACTS_DIR/issue.json"
      fi
      echo ok

  - id: rounds
    depends_on: [brief]
    loop_group:
      max_iterations: 2
      until_bash: 'verdict=$check.output; [ "$verdict" = PASS ]'
      nodes:
        - id: review
          command: review
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob, Write]
          settingSources: [project]

        - id: check
          depends_on: [review]
          bash: |
            set -euo pipefail
            node "$PACK_DIR/archon-usability-review/scripts/usability.mjs" check --dir="$ARTIFACTS_DIR" --repo="$(pwd)"

  - id: report
    depends_on: [rounds]
    bash: |
      set -euo pipefail
      [ -z "$(git status --porcelain)" ] \
        || { echo "the review changed the checkout:" >&2; git status --porcelain >&2; exit 1; }
      node -e 'process.stdout.write(require("fs").readFileSync(process.argv[1], "utf8"))' "$ARTIFACTS_DIR/report.md"
