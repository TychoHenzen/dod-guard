name: sdlc-standards
description: |
  Give a repository dod-guard's engineering standards in the files Archon's
  bundled SDLC pack already reads. The pack's implementer reads
  `engineering.md` before it writes code, and its reviewers cite that file for
  any finding about taste. The triage and build queues read the project's
  `.archon/sdlc/policy/triage.md` and `build.md` after the pack's defaults.
  This workflow writes one marked block into each of those files and opens a
  draft pull request. A rerun replaces only the block, so the project's own
  lines stay. Nothing takes effect until the pull request merges, because
  worktree runs start from the default branch.

  Use when: a repository runs Archon's SDLC pack and should be built and
  reviewed to dod-guard's standards, or dod-guard's standards changed and the
  repository should pick up the new text.
  NOT for: running the lifecycle itself (use archon-intake, archon-build-queue
  and archon-merge-queue), or a repository that does not use the SDLC pack.

  Run with: archon workflow run TychoHenzen/dod-guard:sdlc-standards
            --branch chore/dod-guard-standards [--input open_pr=false]

model: small

inputs:
  open_pr:
    default: "true"
    description: '"true" pushes the branch and opens a draft pull request; anything else stops at the commit.'

nodes:
  - id: preflight
    bash: |
      set -euo pipefail
      [ -z "$(git status --porcelain)" ] \
        || { echo "checkout is not clean; the run commits only the files it writes" >&2; git status --porcelain >&2; exit 1; }
      git rev-parse HEAD

  - id: install
    depends_on: [preflight]
    bash: |
      set -euo pipefail
      node "$PACK_DIR/archon-sdlc-standards/scripts/install.mjs" \
        --source="$PACK_DIR/archon-sdlc-standards/standards" --repo="$(pwd)" > "$ARTIFACTS_DIR/install.json"
      cat "$ARTIFACTS_DIR/install.json"

  # Stages only the files install reported writing. Prints the new head, or
  # "unchanged" when the repository already holds the current standards.
  - id: commit
    depends_on: [install]
    bash: |
      set -euo pipefail
      node -e '
        const rows = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
        for (const row of rows) if (row.action !== "unchanged") console.log(row.path);
      ' "$ARTIFACTS_DIR/install.json" > "$ARTIFACTS_DIR/changed.txt"
      if [ ! -s "$ARTIFACTS_DIR/changed.txt" ]; then echo unchanged; exit 0; fi
      while IFS= read -r path; do git add -- "$path"; done < "$ARTIFACTS_DIR/changed.txt"
      stray=$(git status --porcelain | grep -v '^[AM]  ' || true)
      [ -z "$stray" ] || { printf 'changes outside the installed files; commit nothing:\n%s\n' "$stray" >&2; exit 1; }
      printf 'chore: install dod-guard SDLC standards\n\nWritten by the dod-guard sdlc-standards workflow. Each file holds one\nmarked block; lines outside it are the project'"'"'s own.\n' > "$ARTIFACTS_DIR/commit-message.txt"
      git commit -q -F "$ARTIFACTS_DIR/commit-message.txt"
      git rev-parse HEAD

  # A public write, so a script does it and reads the result back.
  - id: pr
    depends_on: [commit]
    when: "$INPUTS.open_pr == 'true'"
    bash: |
      set -euo pipefail
      head=$commit.output
      if [ "$head" = unchanged ]; then echo "the repository already holds the current standards; no pull request"; exit 0; fi
      base_branch="$BASE_BRANCH"
      [ -n "$base_branch" ] || { echo "Archon resolved no base branch for the pull request" >&2; exit 1; }
      branch=$(git branch --show-current)
      git push -q -u origin "$branch"
      [ "$(git ls-remote --heads origin "$branch" | cut -f1)" = "$head" ] \
        || { echo "the pushed head does not match $head" >&2; exit 1; }
      {
        printf '## Install dod-guard SDLC standards\n\n'
        printf 'Archon'"'"'s SDLC pack reads these files. Each holds one marked block that a rerun of\n'
        printf '`TychoHenzen/dod-guard:sdlc-standards` replaces; lines outside the block are the project'"'"'s own.\n\n'
        while IFS= read -r path; do printf -- '- `%s`\n' "$path"; done < "$ARTIFACTS_DIR/changed.txt"
      } > "$ARTIFACTS_DIR/pr-body.md"
      gh pr create --draft --base "$base_branch" --head "$branch" --title "Install dod-guard SDLC standards" \
        --body-file "$ARTIFACTS_DIR/pr-body.md" > /dev/null
      read_head=$(gh pr view "$branch" --json headRefOid --jq .headRefOid)
      [ "$read_head" = "$head" ] || { echo "the pull request head $read_head is not $head" >&2; exit 1; }
      read_base=$(gh pr view "$branch" --json baseRefName --jq .baseRefName)
      [ "$read_base" = "$base_branch" ] || { echo "the pull request base $read_base is not $base_branch" >&2; exit 1; }
      gh pr view "$branch" --json url --jq .url
