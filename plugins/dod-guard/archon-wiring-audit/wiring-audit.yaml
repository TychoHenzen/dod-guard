name: wiring-audit
description: |
  Audit whether a feature can be found, set up, invoked, used and recovered
  from through real user-facing surfaces. A read-only session follows the
  wiring-audit skill and writes structured findings. A script then holds them
  to the skill's rules against the checkout: every cited file and line exists
  and holds its anchor, and every surface called missing really is absent
  from each path the session says it searched. A failed check goes back to
  the session once with the script's reasons. The report, in the skill's own
  shape, is the run's output and stays in the artifacts. Nothing is edited,
  committed or opened.

  Use when: planning, building or reviewing a feature that a person is meant
  to reach, and the code may lack a command, config, doc, example, API or UI
  path.
  NOT for: interface quality (usability-review), or fixing what it finds.

  Run with: archon workflow run TychoHenzen/dod-guard:wiring-audit
            --branch audit/<name> --input request="<the feature and its goal>"
            [--input issue=<number>]

model: medium

inputs:
  request:
    required: true
    description: The feature to audit and what it is for, or the request that asked for it.
  issue:
    default: ""
    description: Issue number holding the PBI and acceptance criteria. Needs a GitHub remote.

nodes:
  - id: brief
    bash: |
      set -euo pipefail
      printf '%s\n' "$INPUTS_REQUEST" > "$ARTIFACTS_DIR/request.md"
      if [ -n "$INPUTS_ISSUE" ]; then
        case "$INPUTS_ISSUE" in
          *[!0-9]*) echo "issue must be a number: '$INPUTS_ISSUE'" >&2; exit 1 ;;
        esac
        gh issue view "$INPUTS_ISSUE" --json number,title,body,comments > "$ARTIFACTS_DIR/issue.json"
      fi
      echo ok

  - id: rounds
    depends_on: [brief]
    loop_group:
      max_iterations: 2
      until_bash: 'verdict=$check.output; [ "$verdict" = PASS ]'
      nodes:
        - id: audit
          command: audit
          context: fresh
          mutates_checkout: false
          allowed_tools: [Read, Grep, Glob, Write]
          settingSources: [project]

        - id: check
          depends_on: [audit]
          bash: |
            set -euo pipefail
            node "$PACK_DIR/archon-wiring-audit/scripts/wiring.mjs" check --dir="$ARTIFACTS_DIR" --repo="$(pwd)"

  - id: report
    depends_on: [rounds]
    bash: |
      set -euo pipefail
      [ -z "$(git status --porcelain)" ] \
        || { echo "the audit changed the checkout:" >&2; git status --porcelain >&2; exit 1; }
      node -e 'process.stdout.write(require("fs").readFileSync(process.argv[1], "utf8"))' "$ARTIFACTS_DIR/report.md"
