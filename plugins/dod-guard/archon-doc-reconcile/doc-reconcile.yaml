name: doc-reconcile
description: |
  Find documentation claims that contradict or repeat each other, and fix the
  ones git history can settle. A scanner scores candidate pairs of claims in
  tracked Markdown and plugin manifests. A fresh session judges each pair alone
  as CONFLICT, DUPLICATE, STALE-SUBSET or UNRELATED, and a script throws out
  any CONFLICT whose quotes are not in the claims. claim-age dates both sides
  of every CONFLICT and DUPLICATE through `git log -L`. Only a decisive date
  leads to an edit: the older side of a CONFLICT is deleted, and the older copy
  of a DUPLICATE points at the newer one. A session makes those edits; a script
  then reverts every file it changed outside the planned lines. The run ends
  with a draft pull request whose body lists each change with its evidence and
  each pair left undecided with its reason.

  Use when: docs have drifted, two files state different numbers for one thing,
  or the same text is copied in several places.
  NOT for: rewriting or merging docs, editing code, or fixing a claim the
  scanner did not report.

  Run with: archon workflow run TychoHenzen/dod-guard:doc-reconcile
            --branch docs/reconcile [--input open_pr=false]
            [--input generated=<comma-separated globs>]

model: medium

inputs:
  generated:
    default: "plugins/dod-guard/agents/*.md"
    description: >-
      Comma-separated globs of files a generator reads. A pair with a claim in
      one of them is left undecided, because the generated copy would drift.
  open_pr:
    default: "true"
    description: '"true" pushes the branch and opens a draft pull request; anything else stops at the commit.'

nodes:
  # claim-age dates an uncommitted file as AMBIGUOUS, so a dirty tree would
  # silently decide nothing.
  - id: preflight
    bash: |
      set -euo pipefail
      [ -z "$(git status --porcelain)" ] \
        || { echo "checkout is not clean; claim-age cannot date uncommitted files" >&2; git status --porcelain >&2; exit 1; }
      git rev-parse HEAD

  # At most 20 pairs: raise the threshold by 0.05 up to 0.60, then keep the
  # 20 best. The scanner sorts by score before it cuts.
  - id: scan
    depends_on: [preflight]
    bash: |
      set -euo pipefail
      scan="$PACK_DIR/skills/doc-reconcile/scripts/scan-docs.mjs"
      out="$ARTIFACTS_DIR/candidates.json"
      pairs() { node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).pairCount)' "$out"; }
      for threshold in 0.35 0.40 0.45 0.50 0.55 0.60; do
        node "$scan" --root="$(pwd)" --threshold="$threshold" --out="$out"
        if [ "$(pairs)" -le 20 ]; then echo "threshold $threshold, $(pairs) pairs"; exit 0; fi
      done
      node "$scan" --root="$(pwd)" --threshold=0.60 --limit=20 --out="$out"
      echo "threshold 0.60, limit 20"

  - id: prep
    depends_on: [scan]
    bash: |
      set -euo pipefail
      node "$PACK_DIR/archon-doc-reconcile/scripts/reconcile.mjs" prep \
        --dir="$ARTIFACTS_DIR" --candidates="$ARTIFACTS_DIR/candidates.json"

  # One fresh session per pair. After each one the script records the reply,
  # re-queues a malformed pair once, and stops after 20 dispatches.
  - id: judge
    depends_on: [prep]
    when: "$prep.output != '0'"
    model: small
    allowed_tools: [Read, Write]
    loop:
      command: judge
      fresh_context: true
      max_iterations: 20
      until_bash: 'node "$PACK_DIR/archon-doc-reconcile/scripts/reconcile.mjs" advance --dir="$ARTIFACTS_DIR"'

  - id: plan
    depends_on: [prep, judge]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -euo pipefail
      node "$PACK_DIR/archon-doc-reconcile/scripts/reconcile.mjs" plan \
        --dir="$ARTIFACTS_DIR" --repo="$(pwd)" \
        --claim-age="$PACK_DIR/skills/doc-reconcile/scripts/claim-age.mjs" \
        --generated="$INPUTS_GENERATED"

  - id: apply
    depends_on: [plan]
    when: "$plan.output != '0'"
    command: apply
    context: fresh
    allowed_tools: [Read, Edit]
    settingSources: [project]

  # The last word belongs to the script: any file with an edit outside the
  # planned lines, a new file, or a manifest that no longer validates is
  # reverted, and its pairs are reported undecided.
  - id: verify
    depends_on: [plan, apply]
    trigger_rule: none_failed_min_one_success
    bash: |
      set -euo pipefail
      node "$PACK_DIR/archon-doc-reconcile/scripts/reconcile.mjs" verify --dir="$ARTIFACTS_DIR" --repo="$(pwd)"

  - id: report
    depends_on: [verify]
    bash: |
      set -euo pipefail
      node "$PACK_DIR/archon-doc-reconcile/scripts/reconcile.mjs" report --dir="$ARTIFACTS_DIR"

  - id: commit
    depends_on: [report]
    bash: |
      set -euo pipefail
      if [ -z "$(git status --porcelain)" ]; then echo unchanged; exit 0; fi
      git add -u
      printf 'docs: reconcile contradicting and repeated claims\n\nWritten by the dod-guard doc-reconcile workflow. Each change traces to\none judged pair and one claim-age result; see the pull request body.\n' \
        > "$ARTIFACTS_DIR/commit-message.txt"
      git commit -q -F "$ARTIFACTS_DIR/commit-message.txt"
      git rev-parse HEAD

  # A public write, so a script does it and reads the result back.
  - id: pr
    depends_on: [commit]
    when: "$INPUTS.open_pr == 'true'"
    bash: |
      set -euo pipefail
      head=$commit.output
      if [ "$head" = unchanged ]; then echo "nothing changed; no pull request"; exit 0; fi
      base_branch="$BASE_BRANCH"
      [ -n "$base_branch" ] || { echo "Archon resolved no base branch for the pull request" >&2; exit 1; }
      branch=$(git branch --show-current)
      git push -q -u origin "$branch"
      [ "$(git ls-remote --heads origin "$branch" | cut -f1)" = "$head" ] \
        || { echo "the pushed head does not match $head" >&2; exit 1; }
      gh pr create --draft --base "$base_branch" --head "$branch" --title "Reconcile contradicting and repeated doc claims" \
        --body-file "$ARTIFACTS_DIR/report.md" > /dev/null
      read_head=$(gh pr view "$branch" --json headRefOid --jq .headRefOid)
      [ "$read_head" = "$head" ] || { echo "the pull request head $read_head is not $head" >&2; exit 1; }
      read_base=$(gh pr view "$branch" --json baseRefName --jq .baseRefName)
      [ "$read_base" = "$base_branch" ] || { echo "the pull request base $read_base is not $base_branch" >&2; exit 1; }
      gh pr view "$branch" --json url --jq .url
