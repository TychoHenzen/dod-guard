# CI + Publish — triggers on master pushes only.
#
# Releases are driven by package.json, not by tags: a version that is not yet on
# npm gets published, and CI then pushes <package>-v<version> as a record of what
# shipped. Bumping the version IS the release instruction — there is nothing to
# tag by hand and no way for a tag and a version to disagree.
#
# Gates, in the order they can stop a release:
#   build-test        compile + unit tests + which versions are unpublished
#   plugin-config     plugin.json / .mcp.json / marketplace.json / skills / agents consistency
#   static-analysis   Biome, coverage, and three ratchets (quality, test presence, advisories)
#   package-integrity what npm would publish, and whether that bundle actually speaks MCP
#
# The ratchets compare against baselines in .github/quality/. Existing debt is
# allowed; anything worse fails. When a ratchet improves, CI rewrites the
# baseline in the same commit as the Biome autofixes, so the bar only rises.

name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (dod-guard, evomcp, gitevo, obsidian-rag, or "all")'
        required: true
        type: choice
        default: 'all'
        options:
          - dod-guard
          - evomcp
          - gitevo
          - obsidian-rag
          - all

env:
  # Biome owns line width (120); ratcheting it here would fight the formatter.
  QUALITY_RULES: file-length,function-length,complexity,param-count,nesting-depth,types-per-file,duplicate-block,else-branch,unnamed-tuple,dead-export,unused-local,test-only-export,commented-out-code,todo-marker,stateless-method
  QUALITY_SCAN: packages/dod-guard/skills/quality-refactor/scripts/quality-scan.mjs

jobs:
  # ── Always runs ──────────────────────────────────────────────────────

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Which packages hold a version npm has never seen — publish jobs filter on this.
    outputs:
      releases: ${{ steps.detect.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gitevo   # gitevo must build before evomcp (cross-package dep)
      - run: npm run build
      - run: npm test
      - name: Detect releases
        id: detect
        run: node scripts/ci/detect-releases.mjs

  plugin-config:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Names, sources, hook targets, skill/agent frontmatter, encoding, files[] coverage.
      - name: Plugin configuration is consistent
        run: node scripts/ci/validate-plugins.mjs

  static-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config core.fileMode false  # Windows builds set +x on bundle.js — ignore mode changes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A lockfile that npm ci rewrites means the committed one is stale.
      - name: Lockfile is in sync
        run: git diff --exit-code -- package-lock.json

      - run: npm run build -w packages/gitevo
      - run: npm run build

      # Autofix: apply Biome fixes, commit + push if any changes.
      - name: Biome autofix
        run: npx @biomejs/biome check --write --unsafe packages/*/src/ scripts/ci/ --no-errors-on-unmatched

      # ── Ratchets: record the outcome, tighten on improvement, fail at the end ──

      - name: Quality ratchet (structure)
        id: quality
        continue-on-error: true
        run: |
          node "$QUALITY_SCAN" packages \
            --exclude=/dist/ --exclude=node_modules \
            --rules="$QUALITY_RULES" \
            --baseline=.github/quality/quality-baseline.json \
            --fail-on=regression | tee quality-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten quality baseline
        if: steps.quality.outcome == 'success'
        run: |
          if ! grep -q "Improvements: 0 " quality-report.txt; then
            node "$QUALITY_SCAN" packages \
              --exclude=/dist/ --exclude=node_modules \
              --rules="$QUALITY_RULES" \
              --write-baseline=.github/quality/quality-baseline.json
          fi

      - name: Test presence ratchet
        id: tests-present
        continue-on-error: true
        run: |
          node scripts/ci/check-tests-present.mjs | tee tests-present.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten test presence baseline
        if: steps.tests-present.outcome == 'success'
        run: grep -q "fixed:" tests-present.txt && node scripts/ci/check-tests-present.mjs --write-baseline || true

      - name: Advisory ratchet (production dependencies)
        id: audit
        continue-on-error: true
        run: |
          node scripts/ci/check-audit.mjs | tee audit-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten audit baseline
        if: steps.audit.outcome == 'success'
        run: grep -q "fixed:" audit-report.txt && node scripts/ci/check-audit.mjs --write-baseline || true

      - name: Commit & push autofixes and tightened baselines
        run: |
          rm -f quality-report.txt tests-present.txt audit-report.txt
          if ! git diff --exit-code --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply stricter Biome autofixes [skip ci]"
            git push origin master
          fi

      # Strict check: must be clean after autofix.
      - name: Biome strict check
        run: npx @biomejs/biome check packages/*/src/ scripts/ci/ --max-diagnostics=200 --no-errors-on-unmatched

      # Coverage thresholds — fail if any package drops below 90% statements
      - name: Coverage gate (≥90% statements)
        run: |
          echo "=== Coverage gate (≥90% statements) ==="
          FAILED=""
          for pkg in dod-guard evomcp gitevo obsidian-rag; do
            echo "--- $pkg ---"
            npx c8 --include="packages/$pkg/src/*.ts" \
                   --exclude="packages/$pkg/src/*.test.ts" \
                   --exclude="packages/$pkg/src/types.ts" \
                   --exclude="packages/$pkg/src/constants.ts" \
                   --statements 90 \
                   --branches 70 \
                   --functions 80 \
                   --lines 90 \
                   --reporter=text \
                   node --experimental-test-module-mocks --test "packages/$pkg/dist/*.test.js" || FAILED="$FAILED $pkg"
          done
          if [ -n "$FAILED" ]; then
            echo "COVERAGE GATE FAILED for:$FAILED"
            exit 1
          fi
          echo "All packages pass coverage gate."

      # Ratchets run with continue-on-error so baselines still get pushed; enforce here.
      - name: Enforce ratchet outcomes
        run: |
          FAILED=""
          if [ "${{ steps.quality.outcome }}" = "failure" ]; then FAILED="$FAILED structural-quality"; fi
          if [ "${{ steps.tests-present.outcome }}" = "failure" ]; then FAILED="$FAILED test-presence"; fi
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then FAILED="$FAILED advisories"; fi
          if [ -n "$FAILED" ]; then
            echo "RATCHET FAILED for:$FAILED — see the step logs above"
            exit 1
          fi
          echo "All ratchets held."

  package-integrity:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/gitevo
      - run: npm run build
      - run: npm run bundle

      # What npm would actually ship: every skill, agent and hook target present, no src/ or node_modules.
      - name: Tarball contents
        run: |
          FAILED=""
          for pkg in dod-guard evomcp gitevo obsidian-rag; do
            node scripts/ci/check-pack.mjs "$pkg" || FAILED="$FAILED $pkg"
          done
          [ -z "$FAILED" ] || { echo "PACK CONTENTS FAILED for:$FAILED"; exit 1; }

      # The bundle is what users run and nothing else tests it: it must complete an MCP handshake.
      - name: Bundle MCP handshake
        run: |
          FAILED=""
          for pkg in dod-guard evomcp gitevo obsidian-rag; do
            node scripts/ci/smoke-bundle.mjs "$pkg" || FAILED="$FAILED $pkg"
          done
          [ -z "$FAILED" ] || { echo "BUNDLE SMOKE FAILED for:$FAILED"; exit 1; }
  # ── Publish: fires when matching tag points at HEAD AND every gate passed ──

  publish-dod-guard:
    needs: [build-test, plugin-config, static-analysis, package-integrity]
    if: (needs.build-test.outputs.releases != '' && contains(fromJSON(needs.build-test.outputs.releases), 'dod-guard')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'dod-guard' || github.event.inputs.package == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write   # pushes the <package>-v<version> tag after publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run bundle -w packages/dod-guard
      - run: npm publish -w packages/dod-guard

      # The tag records what shipped; it is not what triggered the publish.
      - name: Tag the release
        run: |
          VERSION=$(node -p "require('./packages/dod-guard/package.json').version")
          git tag "dod-guard-v$VERSION"
          git push origin "dod-guard-v$VERSION"

  publish-evomcp:
    needs: [build-test, plugin-config, static-analysis, package-integrity]
    if: (needs.build-test.outputs.releases != '' && contains(fromJSON(needs.build-test.outputs.releases), 'evomcp')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'evomcp' || github.event.inputs.package == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write   # pushes the <package>-v<version> tag after publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w packages/gitevo  # evomcp imports gitevo operations at bundle time
      - run: npm run bundle -w packages/evomcp
      - run: npm publish -w packages/evomcp

      # The tag records what shipped; it is not what triggered the publish.
      - name: Tag the release
        run: |
          VERSION=$(node -p "require('./packages/evomcp/package.json').version")
          git tag "evomcp-v$VERSION"
          git push origin "evomcp-v$VERSION"

  publish-gitevo:
    needs: [build-test, plugin-config, static-analysis, package-integrity]
    if: (needs.build-test.outputs.releases != '' && contains(fromJSON(needs.build-test.outputs.releases), 'gitevo')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'gitevo' || github.event.inputs.package == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write   # pushes the <package>-v<version> tag after publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run bundle -w packages/gitevo
      - run: npm publish -w packages/gitevo

      # The tag records what shipped; it is not what triggered the publish.
      - name: Tag the release
        run: |
          VERSION=$(node -p "require('./packages/gitevo/package.json').version")
          git tag "gitevo-v$VERSION"
          git push origin "gitevo-v$VERSION"

  publish-obsidian-rag:
    needs: [build-test, plugin-config, static-analysis, package-integrity]
    if: (needs.build-test.outputs.releases != '' && contains(fromJSON(needs.build-test.outputs.releases), 'obsidian-rag')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.package == 'obsidian-rag' || github.event.inputs.package == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write   # pushes the <package>-v<version> tag after publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run bundle -w packages/obsidian-rag
      - run: npm publish -w packages/obsidian-rag

      # The tag records what shipped; it is not what triggered the publish.
      - name: Tag the release
        run: |
          VERSION=$(node -p "require('./packages/obsidian-rag/package.json').version")
          git tag "obsidian-rag-v$VERSION"
          git push origin "obsidian-rag-v$VERSION"
