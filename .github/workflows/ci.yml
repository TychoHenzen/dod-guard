# CI - triggers on master pushes only. Nothing in this repo publishes to npm.
#
# The marketplace installs plugins straight from a git checkout of this repo,
# bundle included. static-analysis rebuilds every package's dist/bundle.js and
# commits any drift back to master, so the tracked bundle is always what CI,
# not a developer's working tree, produced. A release is: push to master, wait
# for this workflow to go green, then run /plugin update.
#
# Gates, in the order they can stop a release:
#   build-test        compile + unit tests
#   plugin-config     plugin.json / .mcp.json / marketplace.json / skills / agents consistency, OpenSpec spec validation
#   static-analysis   Biome plus four ratchets (quality, test presence, advisories, coverage), then rebuilds and commits the tracked bundles
#   package-integrity whether the built bundle actually speaks MCP
#
# The ratchets compare against baselines in .github/quality/. Existing debt is
# allowed; anything worse fails. When a ratchet improves, CI rewrites the
# baseline in the same commit as the Biome autofixes, so the bar only rises.

name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # Biome owns line width (120); ratcheting it here would fight the formatter.
  QUALITY_RULES: file-length,function-length,complexity,param-count,nesting-depth,types-per-file,duplicate-block,else-branch,unnamed-tuple,dead-export,unused-local,test-only-export,commented-out-code,todo-marker,stateless-method,comment-bloat,comment-restates-code,assumption-marker
  QUALITY_SCAN: packages/quality-guard/skills/quality-refactor/scripts/quality-scan.mjs

jobs:
  # ── Always runs ──────────────────────────────────────────────────────

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # dod-guard's own tests shell out to the real openspec CLI
      # (fetchInstructions/fetchStatus in src/openspec/steps-cli.test.ts).
      - name: Install the openspec CLI
        run: npm install -g @fission-ai/openspec@1.8.0
      - run: npm test
        env:
          OPENSPEC_TELEMETRY: 0

  plugin-config:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every rule gets a passing and a failing fixture, so a check that can
      # only ever pass gets caught here rather than in a real clone.
      - name: Plugin configuration rules have failing fixtures
        run: node --test scripts/ci/validate-plugins.test.mjs
      # Names, sources, hook targets, skill/agent frontmatter, encoding, git-tracked shipping.
      - name: Plugin configuration is consistent
        run: node scripts/ci/validate-plugins.mjs
      # OpenSpec owns a change's artifacts, dod-guard owns proof, a skill owns
      # choreography. This fails a skill that has taken back one of the others.
      - name: Skills leave OpenSpec's job to OpenSpec
        run: |
          node --test scripts/ci/check-skill-hygiene.test.mjs
          node scripts/ci/check-skill-hygiene.mjs
      - name: Spec hygiene (compound requirement warnings)
        run: |
          node --test scripts/ci/check-spec-hygiene.test.mjs
          node scripts/ci/check-spec-hygiene.mjs
      - name: OpenSpec changes are valid
        env:
          OPENSPEC_TELEMETRY: 0
        run: |
          npm install -g @fission-ai/openspec@1.8.0
          openspec validate --all --strict --no-interactive

  static-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config core.fileMode false  # Windows builds set +x on bundle.js — ignore mode changes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A lockfile that npm ci rewrites means the committed one is stale.
      - name: Lockfile is in sync
        run: git diff --exit-code -- package-lock.json

      - run: npm run build

      # The coverage ratchet below runs dod-guard's own suite under c8, and
      # steps-cli.test.ts shells out to the real openspec CLI.
      - name: Install the openspec CLI
        run: npm install -g @fission-ai/openspec@1.8.0

      # Builds dod-guard itself, because a released binary can't see this
      # checkout's own scenarios and markers - same reason the retired
      # check-trace.mjs did this. Unscoped, this also rebuilds and refreshes
      # all five tracked dist/bundle.js files, so CI, not a developer's
      # working tree, is what builds what ships.
      - run: npm run bundle

      # Autofix: apply Biome fixes, commit + push if any changes.
      - name: Biome autofix
        run: npx @biomejs/biome check --write --unsafe packages/*/src/ scripts/ci/ --no-errors-on-unmatched

      # ── Ratchets: record the outcome, tighten on improvement, fail at the end ──

      - name: Quality ratchet (structure)
        id: quality
        continue-on-error: true
        run: |
          node "$QUALITY_SCAN" packages \
            --exclude=/dist/ --exclude=node_modules \
            --rules="$QUALITY_RULES" \
            --baseline=.github/quality/quality-baseline.json \
            --fail-on=regression | tee quality-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten quality baseline
        if: steps.quality.outcome == 'success'
        run: |
          if ! grep -q "Improvements: 0 " quality-report.txt; then
            node "$QUALITY_SCAN" packages \
              --exclude=/dist/ --exclude=node_modules \
              --rules="$QUALITY_RULES" \
              --write-baseline=.github/quality/quality-baseline.json
          fi

      - name: Test presence ratchet
        id: tests-present
        continue-on-error: true
        run: |
          node scripts/ci/check-tests-present.mjs | tee tests-present.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten test presence baseline
        if: steps.tests-present.outcome == 'success'
        run: grep -q "fixed:" tests-present.txt && node scripts/ci/check-tests-present.mjs --write-baseline || true

      # A consumed .quality-skip is a deliberate bypass of the quality gate.
      # It must not reach a release without a human signing it off.
      - name: Unacknowledged quality-gate waivers
        run: node packages/quality-guard/scripts/check-skips.mjs .

      - name: Advisory ratchet (production dependencies)
        id: audit
        continue-on-error: true
        run: |
          node scripts/ci/check-audit.mjs | tee audit-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten audit baseline
        if: steps.audit.outcome == 'success'
        run: grep -q "fixed:" audit-report.txt && node scripts/ci/check-audit.mjs --write-baseline || true

      - name: Coverage ratchet (per package)
        id: coverage
        continue-on-error: true
        env:
          OPENSPEC_TELEMETRY: 0
        run: |
          node scripts/ci/check-coverage.mjs | tee coverage-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten coverage baseline
        if: steps.coverage.outcome == 'success'
        run: grep -qE "improved:|adopted:" coverage-report.txt && node scripts/ci/check-coverage.mjs --write-baseline || true

      - name: Coverage-gate ratchet (scenarios)
        id: coverage-gate
        continue-on-error: true
        run: |
          node scripts/ci/check-coverage-gate.mjs | tee coverage-gate-report.txt
          exit "${PIPESTATUS[0]}"
      - name: Tighten coverage-gate baseline
        if: steps.coverage-gate.outcome == 'success'
        run: grep -qE "improved:|adopted:" coverage-gate-report.txt && node scripts/ci/check-coverage-gate.mjs --write-baseline || true

      - name: Commit & push autofixes and tightened baselines
        run: |
          rm -f quality-report.txt tests-present.txt audit-report.txt coverage-report.txt coverage-gate-report.txt
          if ! git diff --exit-code --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply Biome autofixes, tightened baselines and rebuilt bundles [skip ci]"
            git push origin master
          fi

      # Strict check: must be clean after autofix.
      - name: Biome strict check
        run: npx @biomejs/biome check packages/*/src/ scripts/ci/ --max-diagnostics=200 --no-errors-on-unmatched

      # Ratchets run with continue-on-error so baselines still get pushed; enforce here.
      - name: Enforce ratchet outcomes
        run: |
          FAILED=""
          if [ "${{ steps.quality.outcome }}" = "failure" ]; then FAILED="$FAILED structural-quality"; fi
          if [ "${{ steps.tests-present.outcome }}" = "failure" ]; then FAILED="$FAILED test-presence"; fi
          if [ "${{ steps.audit.outcome }}" = "failure" ]; then FAILED="$FAILED advisories"; fi
          if [ "${{ steps.coverage.outcome }}" = "failure" ]; then FAILED="$FAILED coverage"; fi
          if [ "${{ steps.coverage-gate.outcome }}" = "failure" ]; then FAILED="$FAILED coverage-gate"; fi
          if [ -n "$FAILED" ]; then
            echo "RATCHET FAILED for:$FAILED — see the step logs above"
            exit 1
          fi
          echo "All ratchets held."

  package-integrity:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle

      # The bundle is what users run and nothing else tests it: it must complete an MCP handshake.
      - name: Bundle MCP handshake
        run: |
          FAILED=""
          for pkg in dod-guard evomcp gitevo obsidian-rag quality-guard; do
            node scripts/ci/smoke-bundle.mjs "$pkg" || FAILED="$FAILED $pkg"
          done
          [ -z "$FAILED" ] || { echo "BUNDLE SMOKE FAILED for:$FAILED"; exit 1; }
