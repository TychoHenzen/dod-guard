# CI - validates pull requests and the resulting master commits. Nothing in
# this repo publishes to npm.
#
# The marketplace installs plugins straight from a git checkout of this repo,
# bundle included. Feature branches must carry rebuilt bundles and tightened
# baselines. CI reproduces them and rejects drift without writing to the branch.
#
# Gates, in the order they can stop a release:
#   build-test        compile + unit tests
#   plugin-config     plugin.json / .mcp.json / marketplace.json / skills / agents consistency
#   static-analysis   Biome plus quality, test presence, advisory, and coverage ratchets, then rejects generated-file drift
#   package-integrity whether the built bundle actually speaks MCP
#
# The ratchets compare against baselines in .github/quality/. Existing debt is
# allowed; anything worse fails. When a ratchet improves, its tightened baseline
# must already be committed on the feature branch.

name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Always runs ──────────────────────────────────────────────────────

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # code-explorer's packaged-browser test launches the real Chromium binary.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test

  advisor-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run the Windows advisor contract
        run: node --test plugins/dod-guard/skills/codex-advisor/scripts/advisor-contract.test.mjs

  plugin-config:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every rule gets a passing and a failing fixture, so a check that can
      # only ever pass gets caught here rather than in a real clone.
      - name: Plugin configuration rules have failing fixtures
        run: node --test scripts/ci/validate-plugins.test.mjs
      # Names, sources, hook targets, skill/agent frontmatter, encoding, git-tracked shipping.
      - name: Plugin configuration is consistent
        run: node scripts/ci/validate-plugins.mjs
  static-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git config core.fileMode false  # Windows builds set +x on bundle.js — ignore mode changes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # actionlint delegates embedded run scripts to the runner's ShellCheck.
      - name: Actionlint rejects an invalid workflow and unsafe shell
        run: |
          command -v shellcheck
          if go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 scripts/ci/fixtures/actionlint-invalid-shell.yml; then
            echo "actionlint accepted the invalid fixture"
            exit 1
          fi
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # A lockfile that npm ci rewrites means the committed one is stale.
      - name: Lockfile is in sync
        run: git diff --exit-code -- package-lock.json

      - name: Run static-analysis preflight
        run: npm run preflight:static-analysis

  package-integrity:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bundle

      - name: Bundle smoke contracts
        run: node --test scripts/ci/smoke-bundle-standalone.test.mjs scripts/ci/smoke-cli-bundle.test.mjs

      # The bundle is what users run and nothing else tests it: it must complete an MCP handshake.
      - name: Bundle MCP handshake
        run: |
          FAILED=""
          for pkg in quality-guard code-explorer knowledge-base; do
            node scripts/ci/smoke-bundle.mjs "$pkg" || FAILED="$FAILED $pkg"
          done
          [ -z "$FAILED" ] || { echo "BUNDLE SMOKE FAILED for:$FAILED"; exit 1; }

      - name: Build Fossil test project
        run: npm run build:test -w packages/fossil
      - name: Fossil CLI bundle smoke
        run: node scripts/ci/smoke-cli-bundle.mjs fossil

      - name: Standalone bundle smoke
        run: node scripts/ci/smoke-bundle-standalone.mjs
