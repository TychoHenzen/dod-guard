<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quality dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <span class="brand">Quality</span>
      <nav id="tabs" class="tabs"></nav>
      <div class="actions">
        <button id="refresh" type="button" title="Regenerate this project's quality report" disabled>Refresh</button>
        <button id="code-explorer" type="button" disabled>Code Explorer</button>
        <span id="code-explorer-status" role="status"></span>
      </div>
    </header>
    <main>
      <aside id="sidebar">
        <input id="filter" type="search" placeholder="Filter files and findings" autocomplete="off" disabled />
        <div id="lists"></div>
      </aside>
      <section id="detail">
        <p class="empty">Select a project.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
